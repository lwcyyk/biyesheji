<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VDNS-PM 安全控制台</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <header>
    <div><span class="eyebrow">VDNS-PM</span><h1>密码库与可信历史</h1></div>
    <button id="refresh">重新验证</button>
  </header>
  <main>
    <section>
      <h2>凭据状态</h2>
      <p>当前版本由 VDNS 状态、对象哈希和透明证明共同确定，云端不能单独指定。</p>
      <div id="credentials" class="cards"></div>
    </section>
    <section class="security-check">
      <h2>隐私安全检查</h2>
      <p>候选密码通过 Native Messaging 创建一次性句柄；结果只显示本次分析伪名、风险类型、置信度和证明引用。</p>
      <label for="audit-secret">要检查的密码</label>
      <input id="audit-secret" type="password" autocomplete="off" spellcheck="false">
      <button id="run-security-check">开始安全检查</button>
      <div id="security-findings" class="cards"></div>
      <button id="security-more" hidden>加载更多</button>
    </section>
    <aside>
      <h2>版本历史</h2>
      <div id="versions" class="timeline empty">选择一条凭据查看历史。</div>
      <h2>设备与恢复</h2>
      <div class="info-card">
        <strong>设备操作凭证</strong>
        <p>设备加入、撤销和恢复均要求能力凭证与单调 issuance counter。</p>
        <button id="device-help">查看安全恢复动作</button>
      </div>
      <div id="recovery-actions" class="info-card" hidden>
        <ol>
          <li>优先由已有设备扫码批准新设备。</li>
          <li>无可用设备时使用高熵 RecoverySecret。</li>
          <li>冲突状态保留双 descriptor 证据后再选择版本。</li>
        </ol>
      </div>
    </aside>
    <div id="status" role="status" aria-live="polite"></div>
  </main>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
