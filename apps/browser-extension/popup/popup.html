<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VDNS-PM</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand">VDNS-PM</div>
    <span id="vault-state" class="badge pending">未解锁</span>
  </header>

  <main>
    <section id="unlock-panel">
      <h1>解锁密码库</h1>
      <label>设备标识<input id="device-id" autocomplete="off" spellcheck="false"></label>
      <label>主密码<input id="master-password" type="password" autocomplete="current-password"></label>
      <button id="unlock" class="primary">解锁</button>
      <p class="hint">主密码只发送给本机 Native Messaging 主机，不进入 HTTP。</p>
    </section>

    <section id="daily-panel" hidden>
      <div class="origin-card">
        <span>当前网站</span>
        <strong id="current-origin">检测中…</strong>
      </div>
      <label>账号<input id="account-id" autocomplete="username" maxlength="512"></label>
      <div class="actions">
        <button id="autofill" class="primary">验证并填充</button>
        <button id="generate">生成密码</button>
        <button id="prepare-change">辅助改密</button>
      </div>

      <div id="create-panel" hidden>
        <h2>保存新凭据</h2>
        <div class="policy">
          <strong>默认策略 v1</strong>
          <span>20 位，包含大小写、数字和符号</span>
        </div>
        <label>用户名<input id="username" autocomplete="username"></label>
        <label>密码句柄<input id="password-handle" readonly></label>
        <button id="save-credential" class="primary">加密保存</button>
        <p id="save-retry" class="warning" hidden>保存未完成；句柄可能已消费，请重新生成后重试。</p>
      </div>

      <div id="change-panel" hidden>
        <h2>网站改密确认</h2>
        <p id="change-summary"></p>
        <p class="warning">只有网站确认或你明确确认后，新版本才会激活；未知状态保留旧版本。</p>
        <div class="actions">
          <button data-outcome="SUCCEEDED">网站已成功</button>
          <button data-outcome="FAILED">修改失败</button>
          <button data-outcome="MFA_REQUIRED">需要 MFA</button>
          <button data-outcome="UNKNOWN">结果未知</button>
        </div>
      </div>

      <div class="secondary-actions">
        <button id="open-dashboard">密码库与历史</button>
        <button id="lock">锁定</button>
      </div>
    </section>

    <section id="account-choice" hidden>
      <h2>选择账号</h2>
      <p>此网站有多个账号，选择后才会请求密码句柄。</p>
      <div id="account-options"></div>
    </section>

    <div id="status" role="status" aria-live="polite"></div>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
