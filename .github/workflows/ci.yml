name: vdns-pm-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y jq sqlite3
      - name: Verify dependencies
        run: go mod verify
      - name: Format
        run: test -z "$(gofmt -l cmd internal tests migrations)"
      - name: Vet
        run: go vet ./...
      - name: Unit and integration tests
        run: go test ./...
      - name: Race tests
        run: go test -race ./internal/... ./tests/contract ./tests/e2e
      - name: Browser extension tests
        working-directory: apps/browser-extension
        run: npm test
      - name: Contracts and secrets
        run: |
          ./scripts/check-g7-api.sh
          ./scripts/check-secrets.sh
          ./scripts/check-spec-trace.sh
      - name: Recovery drill
        run: ./scripts/drill-g7-recovery.sh
