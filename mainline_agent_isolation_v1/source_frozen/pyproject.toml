[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auth-lifecycle-l0"
version = "0.16.0"
description = "Finite bounded authentication lifecycle semantics and independent checks"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
online-state = ["cryptography==50.0.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"auth_lifecycle.online_state" = ["migration.sql"]
