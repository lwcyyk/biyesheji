<text x="195.425" y="58" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="#FFFFFF">第一层：交互平面&lt;br/&gt;扩展 / 桌面 / 移动</text>
<text x="195.425" y="134" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="#FFFFFF">第二层：本地密码学与凭据数据&lt;br/&gt;解锁 / 字段加密 / RouteMap</text>
<text x="195.425" y="210" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="#1A1A2E">第三层：生命周期与多设备同步&lt;br/&gt;创建 / 版本 / 确认 / 撤销</text>
<text x="195.425" y="286" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="#1A1A2E">第四层：可验证状态控制层&lt;br/&gt;身份 / 权限 / 状态 / 证明</text>
<text x="195.425" y="362" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="#1A1A2E">第五层：加密同步存储与周期检查点&lt;br/&gt;密文对象 / 透明日志 / 状态根</text>
<text x="515.975" y="58" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="#1A1A2E">第六层：隐私审计与可选响应&lt;br/&gt;安全检查 / 事故快照 / SCOPE-ZK provider</text>
